spring.application.name=lmpc-compliance

spring.datasource.url=${NEON_URL}
spring.datasource.username=${NEON_USERNAME}
spring.datasource.password=${NEON_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=20

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Configuration
jwt.secret=${JWT_SECRET:a_very_long_fallback_secret_key_that_is_at_least_256_bits_long_for_security_reasons_12345}
jwt.expiration=86400000

# OCR Python Service
ocr.service.url=${OCR_SERVICE_URL:http://127.0.0.1:8000}
